<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BASES House Sim</title>
<style>
  :root {
    --bg: #E9E8E4; --panel: #FFFFFF; --text: #1E1E1E; --muted: #6B6B6B; --line: #D6D4CE;
    --accent: #3A7BD5; --error: #B3261E; --label-bg: rgba(255,255,255,.85);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181B; --panel: #1F2226; --text: #ECECEA; --muted: #9A9C9F; --line: #33373C;
            --error: #FF8A80; --label-bg: rgba(31,34,38,.85); }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; overflow: hidden; }
  #view { flex: 1; position: relative; min-width: 0; }
  #view canvas { display: block; }
  #panel { width: 340px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; margin-left: auto; }
  #info dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px; margin: 0; }
  #info dt { color: var(--muted); }
  #info dd { margin: 0; word-break: break-word; }
  #info ul { margin: 0; padding-left: 16px; }
  #info code { font-size: 11px; }
  .hint { color: var(--muted); }
  #errors div { color: var(--error); border-left: 3px solid var(--error); padding: 4px 8px; margin: 4px 0; word-break: break-word; }
  .robot { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; display: grid; gap: 6px; }
  .robot .status { font-size: 12px; }
  .robot select { font: inherit; font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
  button:disabled { opacity: .45; cursor: default; }
  #phone div { font-size: 12px; padding: 2px 0; color: var(--text); }
  .vignette { position: absolute; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.22) 100%); }
  #fps { position: absolute; right: 10px; bottom: 10px; z-index: 2; font: 12px/1 ui-monospace, monospace; padding: 5px 7px;
    border-radius: 6px; background: var(--label-bg); color: var(--text); pointer-events: none; }
  .room-label { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--label-bg); color: var(--text); pointer-events: none; white-space: nowrap; }
  @media (max-width: 720px) { body { flex-direction: column; } #view { height: 55vh; flex: none; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); flex: 1; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view">
  <div class="vignette"></div>
  <div id="fps" hidden></div>
</div>
<aside id="panel">
  <h1>BASES House Sim</h1>
  <div class="row">
    <button id="play" class="on">Pause</button>
    <button data-mult="1" class="on">1x</button><button data-mult="4">4x</button><button data-mult="16">16x</button><button data-mult="32">32x</button><button data-mult="64">64x</button>
    <span id="clock">00:00:00</span>
  </div>
  <h2>Camera</h2>
  <div class="row" id="cams"><button data-cam="overhead">Overhead</button><button data-cam="threequarter">3/4 View</button></div>
  <div class="row" id="roomcams" style="margin-top:6px"></div>
  <h2>Display</h2>
  <div class="row">
    <label><input type="checkbox" id="t-furnished" checked> Furnished</label>
    <label><input type="checkbox" id="t-labels" checked> Room labels</label>
    <label><input type="checkbox" id="t-paths" checked> Robot paths</label>
    <label><input type="checkbox" id="t-full"> Full-height walls</label>
    <label><input type="checkbox" id="t-hq" checked> Shadows</label>
    <label><input type="checkbox" id="t-fps"> Show FPS</label>
    <label id="t-upper-wrap" hidden><input type="checkbox" id="t-upper" checked> Upper floor</label>
  </div>
  <h2>Scenario</h2>
  <div class="row"><label>Mess level <input type="range" id="mess-level" min="1" max="5" value="3"></label><b id="mess-level-name"></b></div>
  <div id="mess-status" class="hint" style="margin-top:4px"></div>
  <h2>Robots</h2>
  <div id="robots" class="hint">Loading…</div>
  <h2>Phone notifications</h2>
  <div id="phone" class="hint"></div>
  <h2>Selection</h2>
  <div id="info" class="hint">Click a robot, a piece of furniture or a room.</div>
  <div id="errors"></div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { makeTextures, makeSky } from './visuals.js';

const PAL = { wall: 0xF2F2F0, floor: 0xD9D4C7, fixture: 0x2B2B2B, body: 0xF2F2F0, joint: 0x2B2B2B, accent: 0x3A7BD5 };
const CAMS = { overhead: [0, 1, 0.001], threequarter: [0.75, 0.95, -1], room: [0.3, 1, -0.55] };
const $ = id => document.getElementById(id);
const rad = d => (d || 0) * Math.PI / 180;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const list = v => Array.isArray(v) ? (v.length ? '<ul>' + v.map(x => `<li>${esc(typeof x === 'object' ? JSON.stringify(x) : x)}</li>`).join('') + '</ul>' : '—') : esc(v ?? '—');
const fmtTime = t => [t / 3600, (t / 60) % 60, t % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');
const INFO_HINT = 'Click a robot, a piece of furniture or a room.';

function showError(msg) { const d = document.createElement('div'); d.textContent = msg; $('errors').appendChild(d); console.error(msg); }

// ---------- renderer / scene ----------
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));   // retina at 2x costs ~2x the pixels for little visible gain
renderer.info.autoReset = false;   // count draw calls across all post-processing passes (reset each frame)
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;   // stable, no soft-shadow noise
view.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
Object.assign(labelRenderer.domElement.style, { position: 'absolute', top: '0', left: '0', pointerEvents: 'none' });
view.appendChild(labelRenderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 900);   // a tight near/far range keeps depth precise (no flicker between close surfaces)
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
// Image-based lighting gives soft ambient light and reflections; the sun casts the shadows.
const studioEnv = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer), 0.04).texture;
scene.environment = studioEnv;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 0.35));
const sun = new THREE.DirectionalLight(0xfff4e5, 2.4);
sun.position.set(-9, 22, -12); sun.target.position.set(2, 0, 5); scene.add(sun, sun.target);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 });
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
// Surface finish per material name (everything else is matte).
const FINISH = {
  metal: { metalness: 0.75, roughness: 0.3 }, steel: { metalness: 0.65, roughness: 0.32 }, glass: { roughness: 0.04 },
  mirror: { metalness: 1, roughness: 0.04 }, quartz: { roughness: 0.22 }, porcelain: { roughness: 0.18 }, ceramic: { roughness: 0.3 },
  screen: { roughness: 0.12, metalness: 0.3 }, car_body: { metalness: 0.55, roughness: 0.22 }, car_glass: { roughness: 0.05, metalness: 0.4 },
  hardwood: { roughness: 0.45 }, tile: { roughness: 0.3 }, wood_light: { roughness: 0.55 }, wood_dark: { roughness: 0.5 },
  white_appliance: { roughness: 0.3 }, white_cabinet: { roughness: 0.45 }, water: { roughness: 0.05 }, black: { roughness: 0.55 },
  accent: { roughness: 0.35, metalness: 0.1 }, joint: { roughness: 0.4, metalness: 0.3 }, body: { roughness: 0.5 },
};
const mat = (c, opacity = 1, finish = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, transparent: opacity < 1, opacity, depthWrite: opacity === 1, ...finish });
const M = { wall: mat(PAL.wall), floor: mat(PAL.floor), fixture: mat(PAL.fixture), body: mat(PAL.body, 1, FINISH.body),
            joint: mat(PAL.joint, 1, FINISH.joint), accent: mat(PAL.accent, 1, FINISH.accent) };
const bgQuery = matchMedia('(prefers-color-scheme: dark)');
// Furnished: a real sky that also lights the scene. Massing: the plain theme background for clean diagrams.
const TEX = makeTextures();
const SKY = makeSky(renderer, sun.position.clone().sub(sun.target.position));
scene.add(SKY.sky);
const syncBg = () => {
  const furnished = S.furnished;
  SKY.sky.visible = furnished;
  scene.environment = furnished ? SKY.env : studioEnv;
  scene.background = furnished ? null : new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
};
bgQuery.addEventListener('change', () => syncBg());

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);

// ---------- state ----------
const S = { playing: true, mult: 1, t: 0, anim: 0, full: false, furnished: true, sel: null };
let H, meta, roomById = {}, fixById = {};
const floors = {};          // floor index -> { group, walls }
const clickables = [];      // room floors and fixtures
const robots = [];          // see addRobot
const fixtureObjs = {};     // fixture id -> { outer, parts: { name: mesh } }, rebuilt with the house
const houseState = {};      // "@fixture.part" -> last change a robot made, re-applied when the house is rebuilt
const fl = r => r?.floor || 0;
const baseY = f => f * meta.floor_to_floor;

// Named house materials (furnished style); massing style collapses everything to the team palette.
const matCache = {};
function houseMat(name, fallback = M.fixture) {
  if (!S.furnished) return name === 'glass' || name === 'mirror' ? houseMat.glass ??= mat(H.materials.glass, 0.35) : fallback;
  const hex = H.materials?.[name];
  if (!hex) return fallback;
  return matCache[name] ??= Object.assign(mat(hex, H.transparent_materials?.[name] ?? 1, FINISH[name]),
    MAT_DETAIL[name] ? { map: TEX.tile(MAT_DETAIL[name], 2, 2) } : {});
}
// Greyscale detail texture per material (wood grain, fabric weave, stone speckle), tinted by the material's colour.
const MAT_DETAIL = { wood_light: 'grain', wood_dark: 'grain', fabric_grey: 'weave', fabric_blue: 'weave', fabric_beige: 'weave', linen_white: 'weave',
  towel: 'weave', wicker: 'weave', quartz: 'stone', ceramic: 'stone', terracotta: 'stone', rug_living: 'weave', rug_neutral: 'weave', rug_kid: 'weave',
  rug_bath: 'weave', rug_kitchen: 'weave', rug_coir: 'weave', door_leaf: 'grain', cardboard: 'grain' };

function applyTwoStory(h) {
  const v = h.two_story_variant;
  if (!h.meta.two_story || !v) return h;
  for (const k of ['rooms', 'doors', 'fixtures', 'windows']) for (const item of v[k] || []) {
    h[k] ??= [];
    const i = h[k].findIndex(o => o.id === item.id);
    if (i >= 0) h[k][i] = item; else h[k].push(item);
  }
  h.stairs = v.stairs ?? h.stairs;
  Object.assign(h.meta, v.meta || {});
  return h;
}

function floorGroup(f) {
  if (!floors[f]) { const g = new THREE.Group(); g.position.y = baseY(f); scene.add(g); floors[f] = { group: g, walls: null }; }
  return floors[f];
}

function box(w, h, d, material) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material); }

// Shared by house templates and robots: box / cylinder / sphere with optional rotation (degrees).
// Boxes get softly rounded edges (cached by size); very thin ones stay sharp.
const boxCache = new Map();
function roundedBox(w, h, d) {
  const key = `${w}|${h}|${d}`, min = Math.min(w, h, d);
  if (!boxCache.has(key)) boxCache.set(key, min < 0.012 || !isFinite(min) ? new THREE.BoxGeometry(w, h, d) : new RoundedBoxGeometry(w, h, d, 2, Math.min(0.02, min * 0.25)));
  return boxCache.get(key);
}
function primitive(p, material) {
  const s = p.size || [];
  let geo;
  if (p.type === 'box') geo = roundedBox(s[0], s[1], s[2]);
  else if (p.type === 'cylinder') geo = new THREE.CylinderGeometry(p.radius_top ?? p.radius ?? s[0] / 2, p.radius ?? s[0] / 2, p.height ?? s[1], 24);
  else if (p.type === 'sphere') geo = new THREE.SphereGeometry(p.radius ?? s[0] / 2, 24, 16);
  else throw new Error(`unknown primitive type "${p.type}" (use box, cylinder or sphere)`);
  if (Object.values(geo.parameters).some(v => typeof v === 'number' && !isFinite(v))) throw new Error(`primitive "${p.type}" is missing size/radius/height`);
  const m = new THREE.Mesh(geo, material);
  m.castShadow = m.receiveShadow = !material.transparent;
  m.position.fromArray(p.position || [0, 0, 0]);
  const rt = p.rotation || [0, 0, 0]; m.rotation.set(rad(rt[0]), rad(rt[1]), rad(rt[2]));
  return m;
}

// ---------- house: walls, doors, windows ----------
function onLine(item, axis, c, eps) { return Math.abs((axis === 'x' ? item.position[1] : item.position[0]) - c) < eps; }
function along(item, axis) { return axis === 'x' ? item.position[0] : item.position[1]; }

// Every wall run on floor f: where two different rooms (or a room and the outside) meet, with the doors and
// windows that cut it.
function wallSegments(f) {
  const rooms = H.rooms.filter(r => fl(r) === f);
  const doors = H.doors.filter(d => (d.floor || 0) === f);
  const wins = (H.windows || []).filter(w => fl(roomById[w.room]) === f);
  const EPS = 1e-4, segs = [];
  const uniq = a => [...new Set(a.map(v => +v.toFixed(4)))].sort((p, q) => p - q);
  const xs = uniq(rooms.flatMap(r => [r.origin[0], r.origin[0] + r.size[0]]));
  const zs = uniq(rooms.flatMap(r => [r.origin[1], r.origin[1] + r.size[1]]));
  const at = (x, z) => rooms.find(r => x > r.origin[0] && x < r.origin[0] + r.size[0] && z > r.origin[1] && z < r.origin[1] + r.size[1]);
  const open = r => !r || r.outdoor;
  for (const [axis, cs, ts] of [['x', zs, xs], ['z', xs, zs]]) for (const c of cs) for (let i = 0; i < ts.length - 1; i++) {
    const a = ts[i], b = ts[i + 1], m = (a + b) / 2;
    const r1 = axis === 'x' ? at(m, c - EPS * 10) : at(c - EPS * 10, m);
    const r2 = axis === 'x' ? at(m, c + EPS * 10) : at(c + EPS * 10, m);
    if (r1 === r2 || (open(r1) && open(r2))) continue;
    const cuts = [...doors, ...wins].filter(d => onLine(d, axis, c, EPS * 10))
      .map(d => ({ lo: along(d, axis) - d.width / 2, hi: along(d, axis) + d.width / 2, d }))
      .filter(k => k.hi > a && k.lo < b).sort((p, q) => p.lo - q.lo);
    segs.push({ axis, c, a, b, cuts, rooms: [r1, r2], exterior: open(r1) || open(r2), outside: open(r1) ? -1 : open(r2) ? 1 : 0 });
  }
  return segs;
}

function buildWalls(f) {
  const F = floorGroup(f);
  if (F.walls) { F.group.remove(F.walls); F.walls.traverse(o => o.geometry?.dispose()); }
  const g = F.walls = new THREE.Group(); F.group.add(g);
  const T = meta.wall_thickness, EPS = 1e-4;
  const wallH = S.full ? meta.ceiling_height : meta.dollhouse_wall_height;
  const piece = (axis, c, a, b, y0, y1, material = M.wall, thick = T) => {
    y1 = Math.min(y1, wallH);
    if (b - a < EPS || y1 - y0 < EPS) return;
    const m = axis === 'x' ? box(b - a, y1 - y0, thick, material) : box(thick, y1 - y0, b - a, material);
    m.position.set(axis === 'x' ? (a + b) / 2 : c, (y0 + y1) / 2, axis === 'x' ? c : (a + b) / 2);
    m.castShadow = m.receiveShadow = !material.transparent;
    g.add(m);
    if (S.furnished && y0 === 0 && material === M.wall && b - a > 0.05) {     // baseboard on both faces
      const bb = axis === 'x' ? box(b - a, 0.09, thick + 0.024, baseboard) : box(thick + 0.024, 0.09, b - a, baseboard);
      bb.position.set(m.position.x, 0.045, m.position.z); bb.receiveShadow = true; g.add(bb);
    }
  };
  for (const { axis, c, a, b, cuts } of wallSegments(f)) {
    let cur = a - T / 2;
    for (const k of cuts) {
      const lo = Math.max(k.lo, a), hi = Math.min(k.hi, b), d = k.d;
      piece(axis, c, cur, Math.max(k.lo, a - T / 2), 0, wallH);
      if (d.sill != null) {            // window: wall below the sill and above the head, glass between
        piece(axis, c, lo, hi, 0, d.sill);
        piece(axis, c, lo, hi, d.sill + d.height, wallH);
        piece(axis, c, lo, hi, d.sill, d.sill + d.height, houseMat('glass'), T * 0.25);
        piece(axis, c, lo, hi, d.sill - 0.03, d.sill, houseMat('white_cabinet', M.wall), T + 0.06);
      } else if (d.type !== 'opening') {
        piece(axis, c, lo, hi, d.height || meta.door_height, wallH);
        if (d.type === 'slider') {      // fixed pane on the 'start' half; the moving pane is slid open behind it
          const half = (k.lo + k.hi) / 2;
          piece(axis, c - T * 0.2, Math.max(k.lo, a), Math.min(half, b), 0, meta.door_height, houseMat('glass'), 0.03);
          piece(axis, c + T * 0.2, Math.max(k.lo, a), Math.min(half, b), 0, meta.door_height, houseMat('glass'), 0.03);
        }
      }
      cur = Math.max(cur, k.hi);
    }
    piece(axis, c, cur, b + T / 2, 0, wallH);
  }
  for (const d of H.doors.filter(d => (d.floor || 0) === f)) {
    if (d.swing && d.leaf !== false) g.add(doorLeaf(d));
    if (d.fold) bifoldPanels(d).forEach(o => g.add(o));
    if (d.type === 'garage' && S.full) g.add(garageDoor(d));
  }
}

// Door leaf hinged at the 'start' (lower coordinate) or 'end' of the opening, swung open_deg into swing.into.
// A door on an x = const wall line (its rooms meet left/right) is "vertical" in plan view.
function doorIsVertical(d) {
  return d.between.map(id => roomById[id]).filter(Boolean).some(r =>
    Math.abs(r.origin[0] - d.position[0]) < 1e-3 || Math.abs(r.origin[0] + r.size[0] - d.position[0]) < 1e-3);
}
function leafGeom(d) {
  const into = roomById[d.swing.into], vertical = doorIsVertical(d);
  const [px, pz] = d.position, half = d.width / 2, startHinge = (d.swing.hinge || 'start') === 'start';
  const u = vertical ? [0, startHinge ? 1 : -1] : [startHinge ? 1 : -1, 0];
  const cx = into.origin[0] + into.size[0] / 2, cz = into.origin[1] + into.size[1] / 2;
  const n = vertical ? [Math.sign(cx - px), 0] : [0, Math.sign(cz - pz)];
  const hinge = [px - u[0] * half, pz - u[1] * half], a = rad(d.swing.open_deg ?? 90);
  return { hinge, half, dir: [u[0] * Math.cos(a) + n[0] * Math.sin(a), u[1] * Math.cos(a) + n[1] * Math.sin(a)] };
}
// Leaves are cut down with the walls in the dollhouse view, so they don't stick up above them.
const leafHeight = d => S.full ? d.height || meta.door_height : Math.min(d.height || meta.door_height, meta.dollhouse_wall_height ?? 99);
function doorLeaf(d) {
  const { hinge, dir, half } = leafGeom(d), h = leafHeight(d);
  const g = new THREE.Group(), leaf = box(0.04, h, d.width, houseMat('door_leaf', M.wall));
  leaf.position.y = h / 2; g.add(leaf);
  for (const sx of [-1, 1]) {                    // a lever handle on each face, near the free edge
    const knob = box(0.025, 0.025, 0.12, houseMat('steel', M.joint)); knob.position.set(sx * 0.04, 0.95, half - 0.1); g.add(knob);
  }
  g.position.set(hinge[0] + dir[0] * half, 0, hinge[1] + dir[1] * half);
  g.rotation.y = Math.atan2(dir[0], dir[1]);
  return g;
}
// An open bifold: at each end of the opening, its two panels sit folded together, sticking out into fold.into.
function bifoldFootprints(d) {
  const into = roomById[d.fold.into], vertical = doorIsVertical(d), [px, pz] = d.position, w = d.width / 4, t = 0.08;
  const n = vertical ? Math.sign(into.origin[0] + into.size[0] / 2 - px) : Math.sign(into.origin[1] + into.size[1] / 2 - pz);
  return [-1, 1].map(s => {
    const along = (vertical ? pz : px) + s * (d.width / 2 - t / 2 - 0.01), out = (vertical ? px : pz) + n * (w / 2 + 0.05);
    return vertical ? { x: out, z: along, sx: w, sz: t } : { x: along, z: out, sx: t, sz: w };
  });
}
function bifoldPanels(d) {

    let origin, dir = vec(e.dir || c.dir);
    try {
      if (Array.isArray(e.at)) origin = vec(e.at).add(vec(e.offset));
      else { const o = resolve(e.R, e.at); origin = o.localToWorld(vec(e.offset)); if (e.dir) dir.transformDirection(o.matrixWorld); }
    } catch (err) { showError(`robots/${e.R.file}: ${err.message}`); emitters.splice(i, 1); continue; }
    if (!e.R.world.visible) continue;
    dir.normalize();
    const P = pools[e.type];
    for (e.acc += dt * (e.rate ?? c.rate); e.acc >= 1; e.acc--) {
      const j = P.next = (P.next + 1) % POOL, r = () => (Math.random() - 0.5) * 2 * c.spread;
      P.pos.set([origin.x, origin.y, origin.z], j * 3);
      P.vel.set([(dir.x + r()) * c.speed, (dir.y + r()) * c.speed, (dir.z + r()) * c.speed], j * 3);
      P.life[j] = c.life * (0.6 + Math.random() * 0.8);
    }
  }
  for (const [k, P] of Object.entries(pools)) {
    const g = FXLOOK[k].gravity;
    for (let j = 0; j < POOL; j++) {
      if (P.life[j] <= 0) continue;
      if ((P.life[j] -= dt) <= 0) { P.pos[j * 3 + 1] = -999; continue; }
      P.vel[j * 3 + 1] += g * dt;
      for (let a = 0; a < 3; a++) P.pos[j * 3 + a] += P.vel[j * 3 + a] * dt;
    }
    P.geo.attributes.position.needsUpdate = true;

}

// ---------- robots ----------
function waypoint(w) {
  let x, z, f = w.floor;
  if (Array.isArray(w.position)) [x, z] = w.position.length === 3 ? [w.position[0], w.position[2]] : w.position;
  else if (w.fixture) {
    const fx = fixById[w.fixture]; if (!fx) throw new Error(`waypoint "${w.label}" references unknown fixture "${w.fixture}"`);
    const a = rad(fx.rotation), off = fx.size[2] / 2 + meta.approach_clearance;
    x = fx.position[0] + Math.sin(a) * off; z = fx.position[1] + Math.cos(a) * off; f ??= fl(roomById[fx.room]);
  } else if (w.room) {
    const r = roomById[w.room]; if (!r) throw new Error(`waypoint "${w.label}" references unknown room "${w.room}"`);
    x = r.origin[0] + r.size[0] / 2; z = r.origin[1] + r.size[1] / 2; f ??= fl(r);
  } else throw new Error(`waypoint "${w.label ?? '?'}" needs position, fixture or room`);
  if (![x, z].every(isFinite)) throw new Error(`waypoint "${w.label}" has a non-numeric position`);
  if (w.room && !roomById[w.room]) throw new Error(`waypoint "${w.label}" references unknown room "${w.room}"`);
  if (w.fixture && !fixById[w.fixture]) throw new Error(`waypoint "${w.label}" references unknown fixture "${w.fixture}"`);
  f ??= fl(H.rooms.find(r => x >= r.origin[0] && x <= r.origin[0] + r.size[0] && z >= r.origin[1] && z <= r.origin[1] + r.size[1]));
  return new THREE.Vector3(x, baseY(f), z);
}

// Robot bodies use the team palette: body | joint | accent (a "#hex" also works).
function robotMat(p) {
  const c = p.color ?? p.role ?? p.material ?? 'body';
  if (M[c]) return M[c];
  if (/^#[0-9a-f]{3,8}$/i.test(c)) return mat(c);
  throw new Error(`primitive color "${c}" must be body, joint or accent`);
}
// Items (clothes, dishes, crumbs) may also use any house material, e.g. "fabric_blue" or "water".
const itemMatCache = {};
function itemMat(c = 'body') {
  if (M[c]) return M[c];
  if (H.materials?.[c]) return itemMatCache[c] ??= mat(H.materials[c], H.transparent_materials?.[c] ?? 1, FINISH[c]);
  if (/^#[0-9a-f]{3,8}$/i.test(c)) return itemMatCache[c] ??= mat(c);
  throw new Error(`item color "${c}" is not body/joint/accent, a house material or a #hex`);
}

// "Label: a / b / c" becomes a choice; bare options ("whites", "colours") share one choice called "Option".
function parseOptions(list = []) {
  const out = {};
  for (const o of list) {
    const i = o.indexOf(':');
    if (i < 0) (out.Option ??= []).push(o.trim());
    else out[o.slice(0, i).trim()] = o.slice(i + 1).split('/').map(s => s.trim());
  }
  return out;
}

function addRobot(def, file) {
  for (const k of ['name', 'primitives', 'path', 'speed_mps']) if (def[k] == null) throw new Error(`missing required field "${k}"`);
  if (!(def.speed_mps > 0)) throw new Error('speed_mps must be > 0');
  if (!def.path.length) throw new Error('path is empty');
  const R = { def, file, group: new THREE.Group(), fixed: new THREE.Group(), world: new THREE.Group(), parts: {}, items: {},

  R.group.rotation.order = 'YXZ';
  // "parts" are named joints: primitives with "part" move with it, "set"/"motion" pose it smoothly.
  const partDefs = def.parts || {};
  const makePart = (name, chain = []) => {
    if (R.parts[name]) return R.parts[name];
    const d = partDefs[name];
    if (!d) throw new Error(`undefined part "${name}"`);
    if (chain.includes(name)) throw new Error(`part "${name}" is its own parent`);
    const parent = d.parent ? makePart(d.parent, [...chain, name]) : null;
    const pivot = new THREE.Group(), wob = new THREE.Group(), at = vec(d.pivot);
    pivot.rotation.order = wob.rotation.order = 'YXZ';
    pivot.position.copy(parent ? at.clone().sub(parent.at) : at);
    pivot.add(wob); (parent ? parent.wob : R.group).add(pivot);
    return (R.parts[name] = { pivot, wob, at });
  };
  Object.keys(partDefs).forEach(n => makePart(n));
  def.primitives.forEach(p => {
    const m = primitive(p, robotMat(p));
    m.userData.pose = p.pose;
    if (p.part) { const P = makePart(p.part); m.position.sub(P.at); P.wob.add(m); }
    else (p.fixed ? R.fixed : R.group).add(m);

  for (const [name, d] of Object.entries(def.items || {})) {
    const root = new THREE.Group(), wob = new THREE.Group();
    root.rotation.order = wob.rotation.order = 'YXZ';
    root.add(wob);
    for (const p of d.primitives || []) wob.add(primitive(p, itemMat(p.color)));
    R.items[name] = { root, wob, def: d };

  R.line = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: PAL.accent }));
  R.line.visible = $('t-paths').checked;
  scene.add(R.group, R.fixed, R.world, R.line);
  robots.push(R);
  plan(R);
  goIdle(R, true);
  for (const g of [R.group, R.fixed, R.world]) g.traverse(o => { o.userData.robot = R; });
}

// Build the timeline. Each trigger option runs with its first (default) value: waypoints with "only_if" are skipped unless they match it.
function plan(R) {
  const def = R.def;
  R.path = reactive(R) ? buildCleanPath(R) : def.path.filter(w => !w.only_if || Object.entries(w.only_if).every(([k, v]) => [].concat(v).includes(R.opts[k])));
  R.pts = R.path.map(waypoint);
  let pose = R.path.find(w => w.pose)?.pose ?? null;
  R.poses = R.path.map(w => (pose = w.pose ?? pose));
  const loop = def.loop !== false;
  R.legs = []; let t = 0;
  R.pts.forEach((p, i) => {
    R.legs.push({ move: false, i, t0: t, t1: (t += R.path[i].dwell_s ?? def.dwell_s ?? 0) });
    if (i === R.pts.length - 1 && !loop) return;
    const n = (i + 1) % R.pts.length;
    R.legs.push({ move: true, i, n, t0: t, t1: (t += p.distanceTo(R.pts[n]) / def.speed_mps) });
  });
  R.total = t;
  R.line.geometry.setFromPoints((loop ? [...R.pts, R.pts[0]] : R.pts).map(p => p.clone().setY(p.y + 0.02)));
  R.fixed.position.copy(R.pts[0]);
}

function resetItems(R) {
  for (const [name, it] of Object.entries(R.items)) {
    const d = it.def, onRobot = typeof d.at === 'string' && !d.at.startsWith('@');
    const parent = !onRobot ? R.world : d.at === 'body' ? R.group : R.parts[d.at]?.wob;
    if (!parent) throw new Error(`item "${name}" starts on unknown part "${d.at}"`);
    parent.add(it.root);
    it.root.position.copy(onRobot ? vec(d.offset) : worldAt(R, d.at ?? [0, 0, 0], d.offset));
    it.root.rotation.set(...(d.rotation || [0, 0, 0]).map(rad));
    it.root.scale.set(1, 1, 1);
    it.root.visible = d.visible !== false && !(d.demo_only && reactive(R));
    it.root.userData.hingeDeg = 0;

}

function setPose(R, pose) {
  if (pose === R.pose) return;
  R.pose = pose;
  for (const g of [R.group, R.fixed]) g.traverse(o => { if (o.userData.pose) o.visible = [].concat(o.userData.pose).includes(pose); });
}

function cancel(R) {
  const mine = x => x.R === R;
  for (const arr of [events, motions, emitters, tweens]) for (let i = arr.length - 1; i >= 0; i--) if (mine(arr[i])) arr.splice(i, 1);
}

// Idle at the dock. reset=true also restores the "before" scene (setup) and puts items back.
function goIdle(R, reset) {

  R.group.position.copy(R.pts[0]);
  R.yaw = rad(R.path[0].heading_deg ?? 0); R.group.rotation.y = R.yaw;
  setPose(R, R.poses[0]);
  try {
    if (reset) { R.group.traverse(o => { if (o.userData.rest) { o.position.copy(o.userData.rest.pos); o.quaternion.copy(o.userData.rest.quat); } });
                 Object.values(R.parts).forEach(p => p.pivot.scale.set(1, 1, 1)); resetItems(R); if (R.def.setup && !reactive(R)) runOps(R, R.def.setup, S.t, S.t, true); }
    runOps(R, R.path[0], S.t, S.t, true);
  } catch (err) { showError(`robots/${R.file}: ${err.message}`); }
  R.label = 'idle at dock';
}

function startRobot(R) {
  if (R.state === 'running') return;
  if (reactive(R) && !mess.some(m => m.dirt && m.obj.visible)) { makeMess(); notify(R, 'A day later: the house is messy again'); }   // always something to clean
  cancel(R); plan(R); goIdle(R, true);

  for (const l of R.legs) if (!l.move) runOps(R, R.path[l.i], R.start + l.t0, R.start + l.t1, false);

}
function stopRobot(R) {

}

function notify(R, msg) {
  R.status = msg;
  const li = document.createElement('div');
  li.innerHTML = `<span class="hint">${fmtTime(S.t)}</span> <b>${esc(R.def.display_name ?? R.def.name)}</b>: ${esc(msg)}`;
  $('phone').prepend(li);
  while ($('phone').children.length > 8) $('phone').lastChild.remove();
}

function updateRobot(R, dt) {
  if (R.state !== 'running') return;
  const rt = S.t - R.start;
  if (rt >= R.total) {
    R.group.position.copy(R.pts[R.legs[R.legs.length - 1].n ?? R.pts.length - 1]);
    R.state = 'idle'; R.label = 'idle at dock';
    notify(R, R.def.trigger?.notify_on?.includes('done') === false ? 'Finished' : 'Done');
    return;
  }
  const leg = R.legs.find(l => rt <= l.t1) || R.legs[R.legs.length - 1];
  const name = i => R.path[i].label ?? `waypoint ${i + 1}`;
  setPose(R, R.poses[leg.i]);
  let target = R.yaw;
  if (leg.move) {
    const a = R.pts[leg.i], b = R.pts[leg.n], k = leg.t1 > leg.t0 ? (rt - leg.t0) / (leg.t1 - leg.t0) : 1;
    R.group.position.lerpVectors(a, b, k);

    R.label = `→ ${name(leg.n)}`;

    R.group.position.copy(R.pts[leg.i]);
    if (R.path[leg.i].heading_deg != null) target = rad(R.path[leg.i].heading_deg);
    R.label = `${name(leg.i)}` + (R.path[leg.i].needs_user ? ' (stops and notifies the user if needed)' : '');
  }
  const diff = Math.atan2(Math.sin(target - R.yaw), Math.cos(target - R.yaw));
  R.yaw += diff * Math.min(1, dt * 6 * Math.max(1, S.mult / 4));

async function getJSON(url) {
  const res = await fetch(url, { cache: 'no-cache' });   // always pick up teammates' latest robot files
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  try { return JSON.parse(text); } catch (e) { throw new Error(`JSON parse error: ${e.message}`); }
}

async function loadRobots() {
  let files = [];
  try { files = await getJSON('robots/index.json'); if (!Array.isArray(files)) throw new Error('must be a plain array of filenames'); }
  catch (e) { showError(`robots/index.json: ${e.message}`); }
  for (const file of files) {
    try { addRobot(await getJSON('robots/' + file), file); }
    catch (e) { showError(`robots/${file}: ${e.message}`); }
  }
  const box = $('robots');
  box.className = robots.length ? '' : 'hint';
  box.innerHTML = robots.length ? '' : 'No robots yet. Add a filename to robots/index.json.';
  for (const R of robots) {
    const row = document.createElement('div'); row.className = 'robot';
    const name = R.def.display_name ?? R.def.name;
    row.innerHTML = `<label><input type="checkbox" checked> <b>${esc(name)}</b> <span class="hint">${esc(R.file)}</span></label>
      <div class="row"><button class="run on">▶ ${esc(R.def.trigger?.label ?? 'Run')}</button><button class="stop">Stop</button><button class="follow">Follow</button>
      <span class="status hint"></span></div>`;
    row.querySelector('input').onchange = e => {
      for (const g of [R.group, R.fixed, R.world]) g.visible = e.target.checked;
      R.line.visible = e.target.checked && $('t-paths').checked;
    };
    row.querySelector('.run').onclick = () => startRobot(R);
    row.querySelector('.stop').onclick = () => stopRobot(R);
    row.querySelector('.follow').onclick = () => setFollow(S.follow === R ? null : R);
    R.ui = { run: row.querySelector('.run'), status: row.querySelector('.status'), follow: row.querySelector('.follow') };
    box.appendChild(row);
  }
}
function syncRobotUI() {
  let cleaning = false;
  for (const R of robots) {
    if (!R.ui) continue;
    const running = R.state === 'running';
    const txt = running ? `running ${Math.floor(100 * (S.t - R.start) / R.total)}% · ${R.label}` : R.status;
    if (R.ui.status.textContent !== txt) R.ui.status.textContent = txt;
    R.ui.run.disabled = running;
    if (running && reactive(R)) cleaning = true;
    R.ui.follow.classList.toggle('on', S.follow === R);
  }
  $('mess-level').disabled = cleaning;
  if (mess.length) syncMessStatus();
}

// ---------- mess + smart cleaning route ----------
// The house is always a bit messy; the Mess level slider sets how much. Dirt (crumbs, dust, spills) lands on the

// cords, shoes) on the floor. A robot with "auto_clean" plans its own route on a 10 cm grid: it drives to each bit

const messGroup = new THREE.Group(); scene.add(messGroup);
const mess = [];            // { id, kind, label, room, pos: [x, z], obj, dirt: 'vacuum' | 'mop' | undefined }
let messSeed = 7;
const MESS_KINDS = {

  dust:   { dirt: 'vacuum', label: 'dust bunny', rooms: ['bed2', 'bed3', 'primary', 'hallway', 'living', 'foyer'], n: 8 },
  spill:  { dirt: 'mop', label: 'juice spill', rooms: ['kitchen', 'dining', 'foyer'], n: 3 },
  sock:   { label: 'sock', rooms: ['bed2', 'bed3', 'primary', 'hallway'], n: 3 },
  toy:    { label: 'toy', rooms: ['living', 'bed2', 'living'], n: 3 },
  cord:   { label: 'charging cord', rooms: ['living'], n: 1 },
  shoes:  { label: 'pair of shoes', rooms: ['foyer', 'hallway'], n: 1 },

const SURFACES = [

const MESS_LEVELS = ['', 'Light', 'Lived-in', 'Messy', 'Very messy', 'Max'];

  else if (kind === 'sock') g.add(place(box(0.09, 0.03, 0.24, m('terracotta')), 0, 0.015, 0));

function footprint(f) {

  const row = (k, v) => v == null || v === '' ? '' : `<dt>${k}</dt><dd>${v}</dd>`;
  $('info').className = '';
  $('info').innerHTML = `<dl>${row('Robot', `<b>${esc(d.display_name ?? d.name)}</b> <span class="hint">${esc(R.file)}</span>`)}
    ${row('Task', esc(d.task ?? '—'))}
    ${row('Trigger', tr.label ? `${esc(tr.type ?? '')}: “${esc(tr.label)}”` : null)}
    ${row('Form factor', esc(d.form_factor ?? '—'))}
    ${row('Size', d.footprint_m ? `${d.footprint_m.join(' × ')} m footprint${d.height_m ? `, ${d.height_m} m tall` : ''}` : null)}
    ${row('Reach / payload', d.reach_m != null ? `${d.reach_m} m / ${d.payload_kg ?? '—'} kg` : null)}
    ${row('BOM', usd(d.bom_usd))}
    ${row('Cost drivers', list(drivers))}
    ${row('Env changes', list(d.env_changes_required))}
    ${row('Excluded', d.tasks_excluded ? list(d.tasks_excluded) : null)}
    ${row('Cycle', d.cycle_minutes_estimate != null ? `${d.cycle_minutes_estimate} min robot vs ${d.human_minutes_equivalent ?? '—'} min human` : null)}
    <dt>Now</dt><dd id="wp">${esc(R.label)}</dd>${row('Sim cycle', fmtTime(R.total))}</dl>`;
}
function showRoom(r) {
  const area = r.size[0] * r.size[1];
  const doors = H.doors.filter(d => d.between.includes(r.id));
  const wins = (H.windows || []).filter(w => w.room === r.id);
  const fx = H.fixtures.filter(f => f.room === r.id);
  const other = d => d.between.find(x => x !== r.id);
  $('info').className = '';
  $('info').innerHTML = `<dl><dt>Room</dt><dd><b>${esc(r.name)}</b> <span class="hint">${esc(r.id)}</span></dd>
    <dt>Floor</dt><dd>${fl(r)} · ${esc(r.finish ?? '—')}</dd><dt>Size</dt><dd>${r.size[0]} × ${r.size[1]} m</dd>
    <dt>Area</dt><dd>${area.toFixed(2)} m² (${(area * 10.7639).toFixed(0)} sq ft)</dd>
    <dt>Doors</dt><dd>${doors.length ? '<ul>' + doors.map(d => `<li>${d.width} m ${esc(d.type || '')} → ${esc(roomById[other(d)]?.name ?? other(d))}</li>`).join('') + '</ul>' : '—'}</dd>
    <dt>Windows</dt><dd>${wins.length ? wins.map(w => `${w.width} m, sill ${w.sill} m`).join('<br>') : '—'}</dd>
    <dt>Fixtures</dt><dd>${fx.length ? '<ul>' + fx.map(f => `<li>${esc(f.id)} <span class="hint">${esc(f.type)}</span></li>`).join('') + '</ul>' : '—'}</dd></dl>`;
}
function showFixture(f) {
  const t = f.template && H.templates?.[f.template];
  const parts = t ? t.parts.map(p => p.name).filter(Boolean) : [];
  const props = Object.entries(f.props || {}).map(([k, v]) => `<li>${esc(k)}: ${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</li>`).join('');
  $('info').className = '';
  $('info').innerHTML = `<dl><dt>Fixture</dt><dd><b>${esc(f.id)}</b> <span class="hint">${esc(f.type)}</span></dd>
    <dt>Room</dt><dd>${esc(roomById[f.room]?.name ?? f.room)}</dd>
    <dt>Position</dt><dd>[${f.position.join(', ')}] · rot ${f.rotation || 0}°${f.elevation ? ` · elev ${f.elevation} m` : ''}</dd>
    <dt>Size</dt><dd>${f.size.join(' × ')} m</dd>
    ${f.inside ? `<dt>Inside</dt><dd>${esc(f.inside)}</dd>` : ''}
    <dt>Props</dt><dd>${props ? `<ul>${props}</ul>` : '—'}</dd>
    ${parts.length ? `<dt>Parts</dt><dd><code>${parts.map(esc).join(', ')}</code></dd>` : ''}</dl>`;
}

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const rect = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const visible = o => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; };
  const robotHit = ray.intersectObjects(robots.flatMap(R => [R.group, R.fixed, R.world]), true).find(h => visible(h.object));
  if (robotHit) { S.sel = robotHit.object.userData.robot; return showRobot(S.sel); }
  const messHit = ray.intersectObject(messGroup, true)[0];
  if (messHit) { S.sel = null; return showMess(messHit.object.userData.mess); }
  const hit = ray.intersectObjects(clickables).find(h => visible(h.object) && !h.object.material.transparent);
  S.sel = null;
  if (hit?.object.userData.fixture) return showFixture(hit.object.userData.fixture);
  if (hit?.object.userData.room) return showRoom(S.sel = hit.object.userData.room);
  $('info').className = 'hint'; $('info').textContent = INFO_HINT;
});

// ---------- UI ----------
$('play').onclick = () => { S.playing = !S.playing; $('play').textContent = S.playing ? 'Pause' : 'Play'; $('play').classList.toggle('on', S.playing); };
document.querySelectorAll('[data-mult]').forEach(b => b.onclick = () => {
  S.mult = +b.dataset.mult; document.querySelectorAll('[data-mult]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => frame(houseBox(), CAMS[b.dataset.cam]));
// CSS2D labels ignore parent visibility, so sync them with the label toggle and their floor's visibility.
function syncLabels() {
  Object.values(floors).forEach(F => F.group.traverse(o => { if (o.userData.isLabel) o.visible = $('t-labels').checked && F.group.visible; }));
}
$('t-labels').onchange = syncLabels;
$('t-hq').onchange = e => { renderer.shadowMap.enabled = e.target.checked; scene.traverse(o => { if (o.material) o.material.needsUpdate = true; }); };
// A new mess level re-messes the house. The slider is locked while the cleaner is running.
function remess() { makeMess(); robots.filter(R => R.state !== 'running' && reactive(R)).forEach(R => { plan(R); goIdle(R, true); }); }
$('mess-level').oninput = () => { $('mess-level-name').textContent = MESS_LEVELS[$('mess-level').value]; };
$('mess-level').onchange = remess;
$('t-paths').onchange = e => robots.forEach(R => { R.line.visible = e.target.checked && R.group.visible; });
$('t-full').onchange = e => { S.full = e.target.checked; Object.keys(floors).forEach(f => buildWalls(+f)); };
$('t-furnished').onchange = e => { S.furnished = e.target.checked; site.group.visible = S.furnished; syncBg(); buildHouse(); };
$('t-upper').onchange = e => {
  Object.entries(floors).forEach(([f, F]) => { if (+f > 0) F.group.visible = e.target.checked; });
  syncLabels();
};

// ---------- main ----------
const clock = new THREE.Clock();
let fpsAvg = 60;
function tick() {
  const dt = clock.getDelta(), play = S.playing ? dt : 0;
  if ($('t-fps').checked) {
    fpsAvg = fpsAvg * 0.95 + (dt > 0 ? 1 / dt : 0) * 0.05;
    $('fps').hidden = false; $('fps').textContent = `${fpsAvg.toFixed(0)} fps · ${renderer.info.render.calls} draws`;
  } else $('fps').hidden = true;
  S.t += play * S.mult; animT += play; S.anim = animT;
  restoreWobbled();
  runEvents();
  robots.forEach(R => updateRobot(R, play));
  for (let i = tweens.length - 1; i >= 0; i--) if (stepTween(tweens[i])) tweens.splice(i, 1);
  applyMotions();
  stepParticles(play);
  syncRobotUI();
  followTick(dt);
  $('clock').textContent = fmtTime(S.t);
  if (S.sel?.def && $('wp')) $('wp').textContent = S.sel.label;
  if (tween) {
    tween.k = Math.min(1, tween.k + dt / 0.6);
    const e = 1 - Math.pow(1 - tween.k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (tween.k >= 1) tween = null;
  }
  controls.update();
  renderer.info.reset();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}

(async () => {
  resize();
  try { H = applyTwoStory(await getJSON('house.json')); }
  catch (e) {
    const hint = location.protocol === 'file:' ? ' — browsers block fetch() from file://; run "python -m http.server" or use GitHub Pages.' : '';
    showError(`house.json: ${e.message}${hint}`); $('robots').textContent = ''; return;
  }
  meta = H.meta;
  H.rooms.forEach(r => { roomById[r.id] = r; });
  H.fixtures.forEach(f => { fixById[f.id] = f; });
  syncBg();
  buildSite();
  buildHouse();
  H.rooms.forEach(r => {
    const b = document.createElement('button'); b.textContent = r.name;
    b.onclick = () => { frame(roomBox(r), CAMS.room); S.sel = r; showRoom(r); };
    $('roomcams').appendChild(b);
  });
  frame(houseBox(), CAMS.threequarter);
  camera.position.copy(tween.p1); controls.target.copy(tween.t1); tween = null;
  window.sim = { S, robots, camera, controls };   // for poking at the scene from the browser console
  tick();
  await loadRobots();
  remess();
})();
</script>
</body>
</html>
